# Base de datos (espera que el servidor inyecte estas variables de entorno reales)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# APAGAR el log de SQL para no saturar la memoria y los logs del servidor
spring.jpa.show-sql=false

# Seguridad PROD: Obligatorio que el servidor provea la variable JWT_SECRETO
app.jwt.secreto=${JWT_SECRETO}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:86400000}

# Directorio absoluto en el servidor (ej: Linux)
app.archivos.directorio=/var/www/adm_universidad/uploads