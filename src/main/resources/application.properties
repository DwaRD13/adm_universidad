spring.application.name=adm_universidad

# Carga el archivo .env de la raiz del modulo como origen de propiedades.
# Es el mecanismo nativo de Spring Boot: la libreria spring-dotenv no es
# compatible con Boot 4 y dejaba los ${...} sin resolver.
spring.config.import=optional:file:./.env[.properties]

# createDatabaseIfNotExist=true: si DB_NAME no existe todavia, el driver la crea
# en la primera conexion (requiere que DB_USER tenga privilegio CREATE en el servidor).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway crea/actualiza las tablas (src/main/resources/db/migration) antes de que
# arranque el resto del contexto. ddl-auto=validate se queda como red de seguridad:
# Hibernate nunca modifica el esquema, solo confirma que las entidades calzan con
# lo que Flyway acaba de aplicar.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Zona horaria para que las fechas viajen igual entre MySQL, la API y Flutter
spring.jackson.time-zone=America/Santo_Domingo

# Seguridad: el secreto del JWT vive en .env, nunca aqui
app.jwt.secreto=${JWT_SECRETO}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:86400000}

# Archivos subidos por los estudiantes (entregas de tareas)
app.archivos.directorio=${ARCHIVOS_DIRECTORIO:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
